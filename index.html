function maxGap(pid){let best=null;db.values.forEach(v=>{const g=gap(pid,v.id);if(g!=null&&(!best||Math.abs(g)>Math.abs(best.g)))best={v,g}});return best}
function recsOf(pid){return db.records.filter(r=>r.person===pid).sort((a,b)=>b.date.localeCompare(a.date))}
function lastRec(pid){const r=recsOf(pid)[0];return r?daysBetween(r.date,TODAY):null}
function lastOne(pid){const m=db.meetings.filter(m=>m.person===pid&&m.closed).sort((a,b)=>b.date.localeCompare(a.date))[0];return m?daysBetween(m.date,TODAY):null}
function nextOne(pid){return db.meetings.filter(m=>m.person===pid&&!m.closed).sort((a,b)=>a.date.localeCompare(b.date))[0]||null}
const oneOk=pid=>{const d=lastOne(pid);return d!=null&&d<=CFG().cadence};
const evidOk=pid=>{const d=lastRec(pid);return d!=null&&d<=CFG().cadence};
function pTrend(pid){const i=idx(pid);if(i==null)return [];return (db.trendOff[pid]||[0,0,0,0,0,0]).map(o=>+(i+o).toFixed(2))}
function vTrend(vid,ps){const t=teamAdh(vid,ps);if(t==null)return [];return (db.vTrendOff[vid]||[0,0,0,0,0,0]).map(o=>+(t+o).toFixed(2))}
function level(n){if(n==null)return tag('Sem dados','gray');if(n>=CFG().strong)return tag('Forte','green');if(n>=CFG().solid)return tag('Consistente','blue');return tag('Em desenvolvimento','orange')}
function gapChip(g){if(g==null)return '<span class="muted">—</span>';if(g>=CFG().gap)return tag(`Se vê acima ${fmtS(g)}`,'orange');if(g<=-CFG().gap)return tag(`Se subestima ${fmtS(g)}`,'purple');return tag(`Alinhado ${fmtS(g)}`,'gray')}
function scoreBar(n,color='var(--blue)'){return `<span class="score">${fmt(n)}<span class="mini"><b style="width:${n==null?0:Math.max(4,(n-1)/4*100)}%;background:${color}"></b></span></span>`}
function cycle(){return db.cycles.find(c=>c.status==='Em coleta')}
function cycleRate(){const c=cycle();if(!c)return {a:0,p:0,l:0,all:0};let a=0,pd=0,pt=0,l=0;const ids=Object.keys(c.st);ids.forEach(k=>{const s=c.st[k];a+=s.a;if(COL().peers){pd+=s.p[0];pt+=s.p[1]}l+=s.l});const n=ids.length;return {a:pct(a,n),p:pct(pd,pt),l:pct(l,n),all:pct(a+pd+l,n*2+pt),an:a,ln:l,pd,pt,n}}
function heatColor(n){if(n==null)return ['#F3F0E8','#8B918D'];const t=Math.max(0,Math.min(1,(n-3)/2));const c0=[238,244,255],c1=[22,64,140];const c=c0.map((x,i)=>Math.round(x+(c1[i]-x)*t));return [`rgb(${c})`,t>.5?'#fff':'#1C1F1E']}

/* ===== Gráficos SVG ===== */
function radar(series,labels,size=300){const cx=size/2,cy=size/2,R=size/2-74,n=labels.length;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*((v-1)/4);return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};let g='';for(let k=1;k<=5;k++){const ps=labels.map((_,i)=>pt(i,k).join(',')).join(' ');g+=`<polygon points="${ps}" fill="none" stroke="${k===5?'#D8D4C6':'#ECE9DF'}" stroke-width="1"/>`}labels.forEach((l,i)=>{const [x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#ECE9DF"/>`;const [lx,ly]=pt(i,5.9);g+=`<text x="${lx}" y="${ly}" font-size="11" font-weight="600" fill="#4D5651" text-anchor="${Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end'}" dominant-baseline="middle">${E(l.length>20?l.slice(0,19)+'…':l)}</text>`});series.forEach(s=>{if(s.vals.every(v=>v==null))return;const ps=s.vals.map((v,i)=>pt(i,v??1).join(',')).join(' ');g+=`<polygon points="${ps}" fill="${s.color}" fill-opacity=".08" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;s.vals.forEach((v,i)=>{if(v==null)return;const [x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2" data-tip="<b>${E(s.name)}</b><br>${E(labels[i])}: ${fmt(v)}"/>`})});return `<div class="chart" style="max-width:${size}px;margin:0 auto"><svg viewBox="-50 0 ${size+100} ${size}" role="img" aria-label="Radar por valor">${g}</svg></div>`}
function lineChart(series,labels,{w=560,h=220,min=3,max=5,step=.5,endLabels=true}={}){const L=34,Rp=endLabels?150:14,T=12,B=26,iw=w-L-Rp,ih=h-T-B;const x=i=>L+i*iw/(labels.length-1),y=v=>T+ih*(1-(v-min)/(max-min));let g='';for(let v=min;v<=max+1e-9;v+=step){g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" stroke="#ECE9DF"/><text x="${L-8}" y="${y(v)}" font-size="10" fill="#8B918D" text-anchor="end" dominant-baseline="middle">${fmt(v)}</text>`}labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${h-6}" font-size="10.5" fill="#8B918D" text-anchor="middle">${l}</text>`);const ends=[];series.forEach(s=>{if(!s.vals.length)return;g+=`<polyline points="${s.vals.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;s.vals.forEach((v,i)=>g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===s.vals.length-1?4.5:3}" fill="${s.color}" stroke="#fff" stroke-width="1.5"/><circle cx="${x(i)}" cy="${y(v)}" r="11" fill="transparent" data-tip="<b>${E(s.name)}</b><br>${labels[i]}: ${fmt(v)}"/>`);ends.push({s,yy:y(s.vals[s.vals.length-1])})});if(endLabels){ends.sort((a,b)=>a.yy-b.yy);for(let i=1;i<ends.length;i++)if(ends[i].yy-ends[i-1].yy<14)ends[i].yy=ends[i-1].yy+14;ends.forEach(e=>g+=`<text x="${L+iw+10}" y="${e.yy}" font-size="11" fill="#2F3633" dominant-baseline="middle"><tspan font-weight="700">${fmt(e.s.vals[e.s.vals.length-1])}</tspan> ${E(e.s.name)}</text>`)}return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg></div>`}
function groupedBars(cats,series,{w=560,h=220,min=1,max=5}={}){const L=30,T=10,B=34,iw=w-L-10,ih=h-T-B,gw=iw/cats.length,bw=Math.min(26,(gw-24)/series.length);const y=v=>T+ih*(1-(v-min)/(max-min));let g='';for(let v=min;v<=max;v++){g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" stroke="#ECE9DF"/><text x="${L-8}" y="${y(v)}" font-size="10" fill="#8B918D" text-anchor="end" dominant-baseline="middle">${v}</text>`}cats.forEach((c,ci)=>{const x0=L+ci*gw+(gw-bw*series.length-2*(series.length-1))/2;series.forEach((s,si)=>{const v=s.vals[ci];if(v==null)return;const x=x0+si*(bw+2),yy=y(v),hh=T+ih-yy;g+=`<path d="M${x},${T+ih} V${yy+4} Q${x},${yy} ${x+4},${yy} H${x+bw-4} Q${x+bw},${yy} ${x+bw},${yy+4} V${T+ih} Z" fill="${s.color}" data-tip="<b>${E(c)}</b><br>${E(s.name)}: ${fmt(v)}"/><text x="${x+bw/2}" y="${yy-5}" font-size="10" font-weight="700" fill="#2F3633" text-anchor="middle">${fmt(v)}</text>`});g+=`<text x="${L+ci*gw+gw/2}" y="${h-12}" font-size="10.5" fill="#4D5651" text-anchor="middle">${E(c.length>18?c.slice(0,17)+'…':c)}</text>`});g+=`<line x1="${L}" x2="${L+iw}" y1="${T+ih}" y2="${T+ih}" stroke="#D8D4C6"/>`;return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg></div>`}
function stackedBars(labels,series,{w=560,h=210}={}){const L=28,T=12,B=26,iw=w-L-10,ih=h-T-B;const tot=labels.map((_,i)=>series.reduce((s,x)=>s+x.vals[i],0));const mx=Math.ceil(Math.max(...tot)/5)*5||5;const y=v=>T+ih*(1-v/mx);const bw=Math.min(38,iw/labels.length-26);let g='';for(let v=0;v<=mx;v+=5)g+=`<line x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}" stroke="#ECE9DF"/><text x="${L-8}" y="${y(v)}" font-size="10" fill="#8B918D" text-anchor="end" dominant-baseline="middle">${v}</text>`;labels.forEach((l,i)=>{const x=L+i*iw/labels.length+(iw/labels.length-bw)/2;let acc=0;series.forEach((s,si)=>{const v=s.vals[i];if(!v)return;const y1=y(acc+v),y0=y(acc);const top=si===series.length-1||series.slice(si+1).every(z=>!z.vals[i]);g+=top?`<path d="M${x},${y0-(acc?2:0)} V${y1+4} Q${x},${y1} ${x+4},${y1} H${x+bw-4} Q${x+bw},${y1} ${x+bw},${y1+4} V${y0-(acc?2:0)} Z" fill="${s.color}" data-tip="<b>${l}</b><br>${E(s.name)}: ${v}"/>`:`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1-(acc?2:0))}" fill="${s.color}" data-tip="<b>${l}</b><br>${E(s.name)}: ${v}"/>`;acc+=v});g+=`<text x="${x+bw/2}" y="${y(tot[i])-6}" font-size="10.5" font-weight="700" fill="#2F3633" text-anchor="middle">${tot[i]}</text><text x="${x+bw/2}" y="${h-7}" font-size="10.5" fill="#8B918D" text-anchor="middle">${l}</text>`});return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg></div>`}
function spark(vals,color='#1E7A57',w=90,h=26,down=false){if(!vals.length)return '<span class="muted xs">—</span>';const mn=Math.min(...vals)-.05,mx=Math.max(...vals)+.05;const x=i=>2+i*(w-4)/(vals.length-1),y=v=>h-3-(h-6)*(v-mn)/(mx-mn||1);const up=(vals[vals.length-1]-vals[0])*(down?-1:1);const c=up>=.1?'#0B7A43':up<=-.1?'#B42318':color;return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block"><polyline points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3" fill="${c}"/></svg>`}
const legend=items=>`<div class="legend">${items.map(([n,c])=>`<span><i style="background:${c}"></i>${E(n)}</span>`).join('')}</div>`;

/* ===== IA Supervisora: geração de alertas a partir dos dados ===== */
function baseAlerts(){const out=[];db.people.forEach(p=>{const recent=recsOf(p.id).filter(r=>daysBetween(r.date,TODAY)<=30);db.values.forEach(v=>{const g=gap(p.id,v.id);if(g==null)return;const att=recent.filter(r=>r.value===v.id&&r.kind==='atenção').length;const e=ev(p.id,v.id);if(g>=CFG().gap)out.push({id:`gap-${p.id}-${v.id}`,type:'gap',sev:'alta',person:p.id,value:v.id,title:`${p.name} se percebe acima do que o time vê em ${v.name}`,why:[`Autoavaliação ${fmt(e[0])} · colegas ${fmt(e[1])} · líder ${fmt(e[2])} (gap ${fmtS(g)})`,...(att?[`${att} registro(s) de atenção neste valor nos últimos 30 dias`]:[]),'Conversar sobre exemplos concretos costuma reduzir o gap no próximo ciclo'],acts:[['Preparar 1:1',`prep:${p.id}`]]});if(g<=-CFG().gap)out.push({id:`low-${p.id}-${v.id}`,type:'reconhecer',sev:'boa',person:p.id,value:v.id,title:`${p.name} se subestima em ${v.name}`,why:[`Autoavaliação ${fmt(e[0])}, mas colegas (${fmt(e[1])}) e líder (${fmt(e[2])}) a veem como referência`,'Um reconhecimento específico ajuda a pessoa a perceber o próprio impacto'],acts:[['Preparar 1:1',`prep:${p.id}`]]})});const lr=lastRec(p.id),lo=lastOne(p.id),pend=cycle()?.st[p.id];if((lr==null||lr>CFG().cadence)||(pend&&!pend.l))out.push({id:`blind-${p.id}`,type:'ponto',sev:'media',person:p.id,title:`Ponto cego: pouca evidência sobre ${p.name}`,why:[lr==null?'Nenhum registro do líder':`Último registro há ${lr} dias`,...(pend&&!pend.l?['Sua avaliação do ciclo atual está pendente']:[]),...(lo!=null&&lo>CFG().cadence?[`Última 1:1 há ${lo} dias`]:[])],acts:[...(pend&&!pend.l?[['Avaliar agora',`evalL:${p.id}`]]:[]),['Novo registro',`rec:${p.id}`]]});else if(lo!=null&&lo>CFG().cadence&&!nextOne(p.id))out.push({id:`one-${p.id}`,type:'prazo',sev:'media',person:p.id,title:`${p.name} está sem 1:1 há ${lo} dias`,why:['A cadência combinada é quinzenal',`Sugestão: incluir ${recsOf(p.id).length} evidência(s) recentes e o PDI na pauta`],acts:[['Agendar 1:1',`sched:${p.id}`]]});if(pend&&!pend.a)out.push({id:`self-${p.id}`,type:'prazo',sev:'media',person:p.id,title:`${p.name} ainda não fez a autoavaliação`,why:[`Prazo do ciclo: ${dateF(cycle().deadline)}`,`Avaliação de colegas: ${pend.p[0]}/${pend.p[1]} respostas`],acts:[['Enviar lembrete',`remind:${p.id}`]]})});db.people.forEach(p=>{if(quad(p.id)==='alerta'){const lo=[...db.values].map(v=>({v,a:adh(p.id,v.id)})).filter(x=>x.a!=null).sort((a,b)=>a.a-b.a)[0];out.push({id:`cult-${p.id}`,type:'cultural',sev:'alta',person:p.id,value:lo?.v.id,title:`${p.name} entrega acima do esperado, mas a aderência à cultura está abaixo`,why:[`Resultado ${fmt(db.dims[p.id].res)} (líder) · aderência ${fmt(idx(p.id))}, abaixo do corte de ${fmt(CFG().behCut)}`,'Risco descrito no Código: “ele entrega resultado, então pode se comportar de qualquer maneira”',...(lo?[`Pilar mais baixo: ${lo.v.name} (${fmt(lo.a)})`]:[])],acts:[['Preparar 1:1',`prep:${p.id}`]]})}});db.plans.filter(x=>!x.done&&x.due<TODAY).forEach(x=>out.push({id:`late-${x.id}`,type:'prazo',sev:'alta',person:x.person,value:x.value,title:`Ação de PDI atrasada: ${person(x.person).name}`,why:[`“${x.title}” venceu em ${dateF(x.due)}`,'Vale entender as barreiras antes de cobrar o prazo'],acts:[['Preparar 1:1',`prep:${x.person}`],['Marcar concluída',`done:${x.id}`]]}));db.plans.filter(x=>x.done&&x.impact).forEach(x=>out.push({id:`imp-${x.id}`,type:'reconhecer',sev:'boa',person:x.person,value:x.value,title:`${person(x.person).name} evoluiu ${fmtS(x.impact)} em ${value(x.value).name} após o PDI`,why:[`Ação concluída: “${x.title}”`,'Reconhecer a evolução reforça o comportamento'],acts:[['Preparar 1:1',`prep:${x.person}`]]}));const order={alta:0,media:1,boa:2};return out.filter(a=>S.alertState[a.id]!=='x').sort((a,b)=>(S.alertState[a.id]==='ok')-(S.alertState[b.id]==='ok')||order[a.sev]-order[b.sev])}
const ALERT_TYPES=[['todos','Todos'],['gap','Gaps de percepção'],['cultural','Resultado × cultura'],['ponto','Pontos cegos'],['prazo','Prazos e cadência'],['pauta','Pautas de 1:1'],['reconhecer','Reconhecimentos']];
const ALERT_IC={cultural:['layers','orange'],gap:['alert','orange'],ponto:['eye',''],prazo:['clock',''],reconhecer:['heart','teal'],pauta:['calendar','orange']};
function alertCard(a,compact=false){const p=person(a.person),done=S.alertState[a.id]==='ok';return `<div class="alert ${done?'done':''}"><span class="sev ${a.sev}"></span><div class="icon-box ${ALERT_IC[a.type][1]}">${icon(ALERT_IC[a.type][0])}</div><div class="grow"><div class="row" style="gap:7px;flex-wrap:wrap">${avatar(p,22)}<b style="font-size:13px">${E(a.title)}</b>${done?tag('Resolvido','green'):''}</div>${compact?`<div class="smallline" style="margin-top:5px;font-size:11.5px;color:var(--muted)">${E(a.why[0])}</div>`:`<ul class="why">${a.why.map(w=>`<li>${E(w)}</li>`).join('')}</ul>`}${done?'':`<div class="acts">${a.acts.map((x,i)=>`<button class="${i?'btn2':'btn1'} btn-sm" data-alert="${a.id}" data-act="${x[1]}">${E(x[0])}</button>`).join('')}${compact?'':`<button class="btn2 btn-sm" data-alert="${a.id}" data-act="dismiss" style="color:#5F6762">Dispensar</button>`}</div>`}</div></div>`}


function recordItem(r,showPerson=true,portal=false){const p=person(r.person),v=value(r.value);return `<div class="list-row"><div class="icon-box ${r.kind==='positivo'?'teal':'orange'}">${icon(r.kind==='positivo'?'check':'info')}</div><div class="grow"><div class="row" style="gap:7px;flex-wrap:wrap">${showPerson?`<b style="font-size:12px;cursor:pointer" data-person="${p.id}">${E(p.name)}</b>`:''}${tag(vn(v),'blue')}${tag(r.kind==='positivo'?'Positivo':'Para conversar',r.kind==='positivo'?'green':'orange')}${r.step?tag(stepName(r.step),'gray'):''}${r.source==='WhatsApp'&&!portal?tag('WhatsApp · áudio','green'):''}</div><div class="smallline" style="line-height:1.5;margin-top:7px">${E(r.desc)}</div>${r.beh&&behText(r.beh)?`<div class="hint" style="margin-top:5px"><b>Comportamento:</b> ${E(behText(r.beh))}</div>`:''}${r.context?`<div class="hint">${E(r.context)}</div>`:''}</div><span class="xs muted nowrap">${dateF(r.date)}</span></div>`}
function teamTrend(ps=db.people){return MONTHS.map((_,i)=>avg(ps.map(p=>pTrend(p.id)[i])))}

 <div class="card"><div class="row between"><div class="ctit" style="margin:0">${icon('users')} Equipe em um olhar</div><button class="link" data-nav="team">Abrir Raio-X ${icon('arrow',13)}</button></div><div style="margin-top:6px">${db.people.map(p=>`<div class="list-row clickable" data-person="${p.id}" style="padding:7px">${avatar(p,28)}<div class="grow"><div class="mainline" style="font-size:12.5px">${E(p.name)}</div></div>${spark(pTrend(p.id))}<b style="width:30px;text-align:right;font:600 13px Outfit,sans-serif">${fmt(idx(p.id))}</b>${(()=>{const g=maxGap(p.id);return g&&Math.abs(g.g)>=CFG().gap?`<span title="Gap de percepção">${icon('alert',15)}</span>`:'<span style="width:15px"></span>'})()}</div>`).join('')}</div></div>

/* ===== 2 · COLETA ===== */
function collect(){const t=[['cycles','Ciclos de avaliação'],['records','Registros do líder'],['perception','Percepção da cultura']];let body='';
if(S.collectTab==='cycles')body=collectCycles();
if(S.collectTab==='perception'&&COL().pulse==='Desligado')body=`<div class="card"><div class="ctit">Pulso de percepção desligado</div><p class="sub">O formulário mensal sobre os pilares e a liderança não está ativo no seu modelo de coleta.</p>${actionBtn('Ativar em Modelar cultura','go:model:col','btn1','settings')}</div>`;
if(S.collectTab==='records'){const f=S.recFilter;const data=db.records.filter(r=>f==='todos'||(f==='WhatsApp'?r.source==='WhatsApp':r.kind===f)).sort((a,b)=>b.date.localeCompare(a.date));body=`<div class="grid g4">${stat('Registros',db.records.length,'Fatos observados pelo líder')}${stat('Positivos',db.records.filter(r=>r.kind==='positivo').length,'Para reconhecer','#0B7A43')}${stat('Para conversar',db.records.filter(r=>r.kind==='atenção').length,'Viram pauta de 1:1','#B87410')}${stat('Via WhatsApp',db.records.filter(r=>r.source==='WhatsApp').length,'Lançados por áudio','#1B5E43')}</div><div class="card"><div class="row between" style="margin-bottom:9px"><div class="ctit" style="margin:0">Histórico da equipe</div><div class="row">${[['todos','Todos'],['positivo','Positivos'],['atenção','Para conversar'],['WhatsApp','WhatsApp']].map(x=>`<button class="${f===x[0]?'btn1':'btn2'} btn-sm" data-recfilter="${x[0]}">${x[1]}</button>`).join('')}${actionBtn('Novo registro','newRecord','btn1 btn-sm','plus')}</div></div>${data.map(r=>recordItem(r)).join('')||'<p class="sub">Nenhum registro neste filtro.</p>'}</div>`}
if(S.collectTab==='perception'){const pr=db.perception;const sc=db.values.map(v=>({v,a:pr.scores[v.id]})).filter(x=>x.a),low=[...sc].sort((a,b)=>a.a-b.a)[0],lead=db.model.leadership.filter(l=>l.on);body=`<div class="grid split"><div class="card"><div class="row between"><div class="ctit" style="margin:0">${E(pr.title)}</div>${tag(`${pr.answered}/${pr.total} responderam`,'green')}</div><p class="sub" style="margin:4px 0 16px">“Vejo este pilar acontecendo no dia a dia do time.” · respostas anônimas e agregadas</p>${sc.map(x=>`<div class="baritem"><span style="width:190px">${E(x.v.name)}</span><div class="progress"><div style="width:${(x.a-1)/4*100}%;background:${vcolor(x.v)}"></div></div><b style="width:30px">${fmt(x.a)}</b></div>`).join('')}</div><div class="stack">${low?`<div class="card readout"><div class="ctit">${icon('spark')} Leitura da IA</div><p class="small" style="line-height:1.65;color:#2F3633;margin:0"><b>${E(low.v.name)}</b> tem a menor percepção (${fmt(low.a)}). Isso converge com ${db.records.filter(r=>r.value===low.v.id&&r.kind==='atenção').length} registro(s) de atenção neste pilar.</p></div>`:''}<div class="card"><div class="ctit">Temas citados nas respostas abertas</div>${pr.themes.map(t=>`<div class="list-row"><div class="grow small">${E(t[0])}</div>${tag(t[1]+' menções','gray')}</div>`).join('')}</div></div></div>${lead.length?`<div class="card"><div class="row between"><div class="ctit" style="margin:0">Compromissos da liderança · visão do time</div>${tag('Anônimo','gray')}</div><p class="sub" style="margin:4px 0 14px">“Meu líder pratica este compromisso.” Escala de 1 a 5.</p><div class="grid g2" style="column-gap:32px">${lead.map(l=>`<div class="baritem"><span style="width:150px">${E(l.t)}</span><div class="progress"><div style="width:${pr.lead[l.id]?(pr.lead[l.id]-1)/4*100:0}%"></div></div><b style="width:30px">${fmt(pr.lead[l.id])}</b></div>`).join('')}</div></div>`:''}`}
return `<div class="stack">${title('Coleta',(COL().peers?'Três fontes de percepção: a própria pessoa, os colegas e o líder.':'Duas fontes de percepção: a própria pessoa e o líder.')+' Mais os fatos do dia a dia.',`${actionBtn('Ajustar coleta','go:model:col','btn2','settings')}`)}${tabs(t,S.collectTab,'ctab')}${body}</div>`}

/* ===== 3 · EQUIPE ===== */
function team(){const q=S.query.toLocaleLowerCase('pt-BR');const areas=['Todas',...new Set(db.people.map(p=>p.team))];const list=peopleIn(S.teamArea).filter(p=>(p.name+' '+p.role).toLocaleLowerCase('pt-BR').includes(q));return `<div class="stack">${title('Equipe · Raio-X','Clique em uma pessoa para ver o Raio-X: as três visões cruzadas com a cultura.',actionBtn('Novo colaborador','newEmployee','btn2','plus'))}<div class="card"><div class="row between" style="margin-bottom:15px"><div class="ctit" style="margin:0">Colaboradores <span class="chip gray">${list.length}</span></div><div class="filters"><select class="fin" id="team-area">${areas.map(a=>`<option ${a===S.teamArea?'selected':''}>${a}</option>`).join('')}</select><label class="search" style="width:240px">${icon('search',15)}<input id="team-search" placeholder="Buscar nome ou cargo" value="${E(S.query)}"></label></div></div><div class="tablewrap"><table><thead><tr><th>COLABORADOR</th><th>ADERÊNCIA</th><th>NÍVEL</th><th>MAIOR GAP DE PERCEPÇÃO</th><th>6 MESES</th><th>ÚLTIMA EVIDÊNCIA</th><th></th></tr></thead><tbody>${list.map(p=>{const g=maxGap(p.id),lr=lastRec(p.id);return `<tr class="tableclick" data-person="${p.id}"><td><div class="row">${avatar(p,32)}<div><strong>${E(p.name)}</strong><div class="hint" style="margin:2px 0 0">${E(p.role)} · ${E(p.team)}</div></div></div></td><td>${scoreBar(idx(p.id))}</td><td>${level(idx(p.id))}</td><td>${g?`${gapChip(g.g)}<div class="hint" style="margin-top:4px">${E(g.v.name)}</div>`:'—'}</td><td>${spark(pTrend(p.id))}</td><td>${lr==null?tag('Nenhuma','orange'):lr>CFG().cadence?tag(`Há ${lr} dias`,'orange'):`<span class="small">Há ${lr} dia${lr===1?'':'s'}</span>`}</td><td style="color:var(--blue)">${icon('arrow')}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Ninguém encontrado.</td></tr>'}</tbody></table></div><p class="hint" style="margin-top:12px">Aderência = média da visão de colegas e do líder. Gap = autoavaliação menos essa média.</p></div></div>`}

function readout(p){const vs=db.values.map(v=>({v,a:adh(p.id,v.id),g:gap(p.id,v.id)})).filter(x=>x.a!=null);if(!vs.length)return '<p>Ainda não há avaliações suficientes. O Raio-X aparece após o primeiro ciclo.</p>';const s=[...vs].sort((a,b)=>b.a-a.a),strong=s.filter(x=>x.a>=4.2).slice(0,2),weak=s[s.length-1],mg=maxGap(p.id);const rs=recsOf(p.id).filter(r=>daysBetween(r.date,TODAY)<=60);const att={};rs.filter(r=>r.kind==='atenção').forEach(r=>att[r.value]=(att[r.value]||0)+1);const attTop=Object.entries(att).sort((a,b)=>b[1]-a[1])[0];const first=p.name.split(' ')[0];const lead=ev(p.id,'c1')?.[2]==null;
return `<h4>${icon('check',14)} Pontos fortes</h4><p>${strong.length?strong.map(x=>`<b>${E(x.v.name)}</b> (${fmt(x.a)})`).join(' e ')+'. Colegas e liderança convergem nessa leitura.':`Nenhum valor acima de 4,2 ainda. O mais consistente é <b>${E(s[0].v.name)}</b> (${fmt(s[0].a)}).`}</p>
<h4>${icon('target',14)} Oportunidade de desenvolvimento</h4><p><b>${E(weak.v.name)}</b> (${fmt(weak.a)}). Comportamento esperado: ${E(topBeh(weak.v,1).replace(/^./,c=>c.toLowerCase()))}</p>
<h4>${icon('eye',14)} Gap de percepção</h4><p>${mg&&Math.abs(mg.g)>=CFG().gap-.2?(mg.g>0?`${first} se avalia <b>${fmt(selfS(p.id,mg.v.id))}</b> em ${E(mg.v.name)}, mas o time vê <b>${fmt(adh(p.id,mg.v.id))}</b>. Vale buscar exemplos concretos juntos, sem rótulo.`:`${first} se avalia <b>${fmt(selfS(p.id,mg.v.id))}</b> em ${E(mg.v.name)}, mas o time vê <b>${fmt(adh(p.id,mg.v.id))}</b>. Se subestima: um reconhecimento específico ajuda.`):'Autoavaliação alinhada com a visão de colegas e líder. Bom sinal de autoconhecimento.'}${lead?' <i>(avaliação do líder pendente neste ciclo)</i>':''}</p>
<h4>${icon('layers',14)} Padrões nas evidências</h4><p>${rs.length} registro(s) em 60 dias${attTop?`, ${attTop[1]} de atenção em <b>${E(value(attTop[0]).name)}</b>${mg&&mg.v.id===attTop[0]?'. Isso converge com o gap acima.':'.'}`:', todos positivos.'}</p>
<h4>${icon('message',14)} Sugestão para a próxima 1:1</h4><p>${mg&&mg.g>=CFG().gap-.2?`Começar pelo que vai bem em ${E(s[0].v.name)}. Depois, perguntar como ${first} enxerga ${E(mg.v.name)} e trazer 1 exemplo concreto.`:mg&&mg.g<=-(CFG().gap-.2)?`Reconhecer de forma específica a atuação em ${E(mg.v.name)} e explorar como ${first} pode multiplicar isso no time.`:`Explorar ${E(weak.v.name)} com uma pergunta aberta e combinar uma ação pequena para as próximas 2 semanas.`}</p>${principle('Hipóteses para conversar, não veredito. A IA sugere, o líder decide.')}`}

function employee(){const p=person(S.selected);const rs=recsOf(p.id),pp=db.plans.filter(x=>x.person===p.id),mm=db.meetings.filter(m=>m.person===p.id).sort((a,b)=>b.date.localeCompare(a.date));const i=idx(p.id),tr=pTrend(p.id),mg=maxGap(p.id),c=cycle()?.st[p.id];let body='';
if(S.rxTab==='raiox'){const labels=db.values.map(v=>vn(v));const series=SRC.map(s=>({name:s.name,color:s.color,vals:db.values.map(v=>ev(p.id,v.id)?.[s.k]??null)}));body=`<div class="grid split"><div class="card"><div class="row between"><div class="ctit" style="margin:0">${icon('radar')} As três visões, por valor</div>${legend(SRC.map(s=>[s.name,s.color]))}</div><div class="row top" style="gap:18px;margin-top:8px"><div style="width:330px;flex-shrink:0">${radar(series,labels,330)}</div><div class="grow"><table class="vt"><thead><tr><th>PILAR</th><th>AUTO</th><th>COLEGAS</th><th>LÍDER</th><th>ADERÊNCIA</th><th>GAP</th></tr></thead><tbody>${db.values.map(v=>{const e=ev(p.id,v.id)||[],g=gap(p.id,v.id);return `<tr><td style="padding-left:6px"><div class="row" style="gap:7px;align-items:flex-start"><span class="dot-c" style="background:${vcolor(v)};margin:4px 0 0;flex-shrink:0"></span>${E(v.name)}</div></td><td>${fmt(e[0])}</td><td>${fmt(e[1])}</td><td>${e[2]==null?tag('Pend.','orange'):fmt(e[2])}</td><td><b>${fmt(adh(p.id,v.id))}</b></td><td>${g==null?'—':g>=CFG().gap?tag(fmtS(g),'orange'):g<=-CFG().gap?tag(fmtS(g),'purple'):`<span class="xs muted">${fmtS(g)}</span>`}</td></tr>`}).join('')}</tbody></table><div class="legend" style="margin-top:10px"><span>${tag('+','orange')} se vê acima do time</span><span>${tag('−','purple')} se subestima</span></div></div></div></div><div class="card readout"><div class="ctit">${icon('spark')} Leitura da IA Supervisora</div>${readout(p)}</div></div>
<div class="grid split"><div class="card"><div class="row between"><div class="ctit" style="margin:0">${icon('trend')} Evolução da aderência</div>${legend([[p.name.split(' ')[0],'#1E7A57'],['Média da equipe','#8B918D']])}</div>${lineChart([{name:p.name.split(' ')[0],color:'#1E7A57',vals:tr},{name:'Média equipe',color:'#8B918D',vals:teamTrend()}],MONTHS,{h:200})}</div><div class="stack"><div class="card"><div class="ctit">Base do Raio-X</div><div class="small" style="line-height:2;color:#4D5651">${icon('user',14)} Autoavaliação: ${c?.a?'respondida':'pendente'}<br>${icon('users',14)} Colegas: ${c?c.p[0]:0} avaliações (anônimas)<br>${icon('shield',14)} Líder: ${c?.l?'concluída':'pendente'}<br>${icon('file',14)} Registros: ${rs.length} (${rs.filter(r=>r.source==='WhatsApp').length} por áudio)<br>${icon('message',14)} Feedbacks: ${db.feedbacks.filter(f=>f.person===p.id).length}</div>${c&&!c.l?`<button class="btn1 btn-sm" style="margin-top:10px" data-action="evalL:${p.id}">Fazer minha avaliação</button>`:''}</div>${dimsCard(p)}</div></div>`}
if(S.rxTab==='evid')body=`<div class="grid split"><div class="card"><div class="row between"><div class="ctit" style="margin:0">Registros (${rs.length})</div>${actionBtn('Novo registro','newRecordSel','btn2 btn-sm','plus')}</div>${rs.map(r=>recordItem(r,false)).join('')||'<p class="sub">Nenhum registro.</p>'}</div><div class="card"><div class="ctit">Feedbacks estruturados</div>${db.feedbacks.filter(f=>f.person===p.id).map(fbItem).join('')||'<p class="sub">Nenhum feedback ainda.</p>'}<button class="btn2 btn-sm" style="margin-top:10px" data-action="fb:${p.id}:${mg?.v.id||'c1'}">${icon('edit',14)} Estruturar feedback</button></div></div>`;
if(S.rxTab==='dev')body=`<div class="grid split"><div class="card"><div class="row between"><div class="ctit" style="margin:0">Plano de desenvolvimento</div>${pdiBtn(p.id)}</div>${pp.map(planItem).join('')||'<p class="sub">Sem ações cadastradas.</p>'}</div><div class="card"><div class="ctit">Reuniões 1:1</div>${mm.map(m=>`<div class="list-row clickable" data-meeting="${m.id}"><div class="icon-box">${icon('calendar')}</div><div class="grow"><b class="small">${dateF(m.date)} · ${E(m.time)}</b><div class="smallline">${m.closed?(m.notes?'Combinado: '+E(m.notes):'Concluída'):(m.confirmed?'Agendada · pauta confirmada':'Agendada · pauta a revisar')}</div></div>${tag(m.closed?'Concluída':'Agendada',m.closed?'gray':'blue')}</div>`).join('')||'<p class="sub">Nenhuma reunião.</p>'}</div></div>`;
return `<div class="stack"><div class="row"><button class="link" data-nav="team">${icon('chevronLeft',14)} Equipe</button></div><div class="card"><div class="row between"><div class="row">${avatar(p,58)}<div><div class="eyebrow">Raio-X do colaborador</div><h1 class="h1" style="font-size:24px;margin-top:3px">${E(p.name)}</h1><p class="sub" style="margin:3px 0 0">${E(p.role)} · ${E(p.team)} · Desde ${E(p.join)}</p></div></div><div class="row" style="gap:26px"><div><div class="eyebrow">Aderência</div><div style="font:600 26px Outfit,sans-serif;margin-top:4px">${fmt(i)} ${tr.length?`<span class="delta ${tr[5]-tr[4]>=0?'up':'down'}" style="font-size:12px">${fmtS(tr[5]-tr[4])}</span>`:''}</div></div><div><div class="eyebrow">Nível</div><div style="margin-top:8px">${level(i)}</div></div><div><div class="eyebrow">Maior gap</div><div style="margin-top:8px">${mg?gapChip(mg.g):'—'}</div></div><div class="row">${actionBtn('Estruturar feedback','fb:'+p.id+':'+(mg?.v.id||'c1'),'btn2','edit')}${actionBtn('Preparar 1:1','prep:'+p.id,'btn1','calendar')}</div></div></div></div>${tabs([['raiox','Raio-X'],['evid','Evidências'],['dev','Desenvolvimento']],S.rxTab,'rxtab')}${body}</div>`}

/* ===== 4 · IA SUPERVISORA ===== */
function ai(){const al=buildAlerts(),f=S.alertFilter,list=al.filter(a=>f==='todos'||a.type===f),open=al.filter(a=>S.alertState[a.id]!=='ok');const nEv=db.records.length+Object.keys(db.evals).length*db.values.length*3;return `<div class="stack">${title('IA Supervisora','Analisa tudo continuamente, cruza com o Código de Cultura e diz onde agir. Você só decide.','')}
<div class="aihero"><div class="icon-box" style="width:58px;height:58px;background:rgba(255,255,255,.14);color:#C8F25A">${icon('spark',29)}</div><div class="grow"><span class="ai-badge"><span class="dot" style="background:#C8F25A"></span> Analisando continuamente · última leitura há 4 min</span><h2 style="margin-top:10px">Você tem ${open.length} sugestões abertas. ${open.filter(a=>a.sev==='alta').length} pedem ação esta semana.</h2><p>${nEv} evidências cruzadas: autoavaliações, avaliações de colegas, suas avaliações, registros e formulários.</p></div><div class="row" style="gap:22px;padding-right:8px">${[['Gaps',al.filter(a=>a.type==='gap').length],['Pontos cegos',al.filter(a=>a.type==='ponto').length],['Reconhecer',al.filter(a=>a.type==='reconhecer').length]].map(x=>`<div style="text-align:center"><div style="font:600 28px Outfit,sans-serif">${x[1]}</div><div class="xs" style="color:#BFD8C8">${x[0]}</div></div>`).join('')}</div></div>
<div class="grid split"><div><div class="row" style="flex-wrap:wrap;gap:7px;margin-bottom:12px">${ALERT_TYPES.map(x=>`<button class="${f===x[0]?'btn1':'btn2'} btn-sm" data-afilter="${x[0]}">${x[1]}</button>`).join('')}</div>${list.map(a=>alertCard(a)).join('')||'<div class="card"><p class="sub">Nada aqui. 🎉</p></div>'}</div>
<div class="card" style="display:flex;flex-direction:column;height:620px;position:sticky;top:0"><div class="ctit">${icon('message')} Pergunte à IA</div><div class="field" style="margin-bottom:10px"><select class="fin" id="ai-person">${db.people.map(p=>`<option value="${p.id}" ${S.selected===p.id?'selected':''}>Contexto: ${E(p.name)}</option>`).join('')}</select></div><div id="chatbox" style="display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;padding-right:5px">${S.copilot.map(m=>`<div class="message ${m.who==='ai'?'ai':'me'}" style="white-space:pre-line;font-size:12.5px">${E(m.text)}</div>`).join('')}</div><div class="prompts" style="margin:10px 0">${['Como está essa pessoa?','Monte a pauta da 1:1','Sugira um PDI','Escreva um feedback','Qual pilar mais precisa de atenção?'].map(q=>`<button data-prompt="${q}">${q}</button>`).join('')}</div><div class="row"><input class="fin grow" id="ai-input" placeholder="Pergunte sobre a equipe…" value="${E(S.draftAI)}"><button class="btn1" data-action="sendAI">${icon('send',16)}</button></div></div></div></div>`}
function simulatedAi(text){const q=text.toLocaleLowerCase('pt-BR'),p=person(S.selected),f=p.name.split(' ')[0],mg=maxGap(p.id);if(q.includes('pauta')||q.includes('1:1'))return `Pauta sugerida para ${f}:\n\n`+agendaList(p).map((x,i)=>`${i+1}. ${x}`).join('\n');if(q.includes('pdi')||q.includes('desenvolv')){const d=pdiSuggest(p.id);return `PDI sugerido para ${f}, com foco em ${value(d.value).name} (${d.reason}):\n\n`+d.items.map((x,i)=>`${i+1}. ${x.title} · até ${dateS(x.due)}`).join('\n')+'\n\nQuer que eu adicione? Use “Gerar PDI com IA” no Raio-X.'}if(q.includes('feedback')){const d=fbDraft(p.id,mg?.v.id);return `Feedback estruturado (SCI) para ${f}:\n\nSituação: ${d.s}\nComportamento: ${d.c}\nImpacto: ${d.i}`}if(q.includes('pilar')||q.includes('valor')||q.includes('cultura')||q.includes('equipe')){const s=[...db.values].map(v=>({v,a:teamAdh(v.id)})).filter(x=>x.a).sort((a,b)=>a.a-b.a);return `O valor que mais precisa de atenção é ${s[0].v.name} (aderência ${fmt(s[0].a)}). Ele também tem a menor percepção no formulário (${fmt(db.perception.scores[s[0].v.id])}) e ${db.records.filter(r=>r.value===s[0].v.id&&r.kind==='atenção').length} registros de atenção. O mais forte é ${s[s.length-1].v.name} (${fmt(s[s.length-1].a)}).\n\nSugestão: levar o tema para a reunião de equipe com 2 exemplos positivos de quem é referência.`}const i=idx(p.id),rs=recsOf(p.id);return `${p.name} · aderência ${fmt(i)} (${level(i).replace(/<[^>]+>/g,'')})\n\n• ${mg?`Maior gap em ${mg.v.name}: autoavaliação ${fmt(selfS(p.id,mg.v.id))} vs. time ${fmt(adh(p.id,mg.v.id))}`:'Sem gaps relevantes'}\n• ${rs.length} registro(s), último há ${lastRec(p.id)??'—'} dias\n• ${db.plans.filter(x=>x.person===p.id&&!x.done).length} ação(ões) de PDI em aberto\n• Última 1:1 há ${lastOne(p.id)??'—'} dias${nextOne(p.id)?`, próxima em ${dateS(nextOne(p.id).date)}`:''}`}

function refFor(pid,vid){return db.people.filter(x=>x.id!==pid).map(x=>({x,a:adh(x.id,vid)})).filter(z=>z.a).sort((a,b)=>b.a-a.a)[0]?.x.name||'um colega'}
function pdiSuggest(pid,fv){const mg=maxGap(pid);let vid,reason;if(fv){vid=fv;reason='ponto tratado na 1:1'}else if(mg&&mg.g>=CFG().gap-.2){vid=mg.v.id;reason=`maior gap de percepção (${fmtS(mg.g)})`}else{const w=db.values.map(v=>({v,a:adh(pid,v.id)})).filter(x=>x.a).sort((a,b)=>a.a-b.a)[0];vid=w?.v.id||db.values[0].id;reason=`menor aderência (${fmt(w?.a)})`}const lib=PDI_LIB[vid]||['Definir com o líder um comportamento-alvo para '+value(vid).name,'Registrar 2 exemplos práticos no mês','Revisar evolução na 1:1'];const ref=refFor(pid,vid);return {person:pid,value:vid,reason,items:lib.map((t,i)=>({title:t.replace('{ref}',ref),due:addDays(TODAY,[14,30,45][i])}))}}

/* ===================== Resultado × Comportamento ===================== */
const QUAD={ref:['Referência','green','Alto resultado e alta aderência à cultura'],alerta:['Alerta cultural','orange','Alto resultado, aderência abaixo do esperado'],apoiar:['Apoiar na entrega','blue','Boa aderência, resultado abaixo do esperado'],plano:['Plano de ação','red','Resultado e aderência abaixo do esperado']};
function quad(pid){const r=db.dims[pid]?.res,b=idx(pid);if(r==null||b==null||!db.model.dims.find(d=>d.id==='res')?.on)return null;const hr=r>=CFG().resCut,hb=b>=CFG().behCut;return hr&&hb?'ref':hr?'alerta':hb?'apoiar':'plano'}
function dimsCard(p){const d=db.dims[p.id]||{},tr=pTrend(p.id),evo=tr.length?tr[5]-tr[0]:null,q=quad(p.id);const act=db.model.dims.filter(x=>x.on);const val=id=>id==='res'?d.res:id==='qual'?d.qual:id==='comp'?idx(p.id):evo;
 const row=x=>{const v=val(x.id);const right=x.id==='evo'?(v==null?'—':tag(`${fmtS(v)} em 6 meses`,v>=.1?'green':v<=-.1?'red':'gray')):(v==null?tag('Pendente','orange'):scoreBar(v));return `<div class="list-row" style="padding:10px 4px"><div class="grow"><div class="mainline">${E(x.t)}</div><div class="smallline" style="line-height:1.45">${E(x.q)}</div></div>${right}</div>`};
 return `<div class="card"><div class="row between"><div class="ctit" style="margin:0">Dimensões de avaliação</div>${q?tag(QUAD[q][0],QUAD[q][1]):''}</div>${act.map(row).join('')||'<p class="sub">Nenhuma dimensão ativa.</p>'}${q?`<p class="hint">${QUAD[q][2]}. Cortes: resultado ≥ ${fmt(CFG().resCut)} · aderência ≥ ${fmt(CFG().behCut)}.</p>`:''}</div>`}
function quadChart(ps){const w=560,h=380,L=46,T=12,B=44,Rr=14,iw=w-L-Rr,ih=h-T-B,mn=3,mx=5;const cl=v=>Math.max(mn,Math.min(mx,v)),x=v=>L+(cl(v)-mn)/(mx-mn)*iw,y=v=>T+ih*(1-(cl(v)-mn)/(mx-mn));const cx=x(CFG().behCut),cy=y(CFG().resCut);const rect=(x0,y0,x1,y1,c)=>`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${c}"/>`;
 let g=rect(L,T,cx,cy,'#FFF6E8')+rect(cx,T,L+iw,cy,'#E8F7EF')+rect(L,cy,cx,T+ih,'#F3F0E8')+rect(cx,cy,L+iw,T+ih,'#EAF4EE');
 for(let v=mn;v<=mx+1e-9;v+=.5)g+=`<text x="${x(v)}" y="${T+ih+16}" font-size="10" fill="#8B918D" text-anchor="middle">${fmt(v)}</text><text x="${L-8}" y="${y(v)}" font-size="10" fill="#8B918D" text-anchor="end" dominant-baseline="middle">${fmt(v)}</text>`;
 g+=`<line x1="${cx}" x2="${cx}" y1="${T}" y2="${T+ih}" stroke="#A3A9A5" stroke-dasharray="4 4"/><line x1="${L}" x2="${L+iw}" y1="${cy}" y2="${cy}" stroke="#A3A9A5" stroke-dasharray="4 4"/>`;
 const lab=(t,xx,yy,a,c)=>`<text x="${xx}" y="${yy}" font-size="10.5" font-weight="800" letter-spacing=".06em" fill="${c}" text-anchor="${a}">${t}</text>`;
 g+=lab('ALERTA CULTURAL',L+10,T+18,'start','#A06005')+lab('REFERÊNCIA',L+iw-10,T+18,'end','#0B7A43')+lab('PLANO DE AÇÃO',L+10,T+ih-10,'start','#6F7773')+lab('APOIAR NA ENTREGA',L+iw-10,T+ih-10,'end','#0F4D3A');
 g+=`<text x="${L+iw/2}" y="${h-6}" font-size="11" fill="#4D5651" text-anchor="middle">Aderência à cultura (comportamento) →</text><text transform="translate(12 ${T+ih/2}) rotate(-90)" font-size="11" fill="#4D5651" text-anchor="middle">Resultado (líder) →</text>`;
 ps.forEach(p=>{const q=quad(p.id);if(!q)return;const px=x(idx(p.id)),py=y(db.dims[p.id].res);g+=`<circle cx="${px}" cy="${py}" r="14" fill="${q==='alerta'?'#C08A1E':'#1E7A57'}" stroke="#fff" stroke-width="2"/><text x="${px}" y="${py}" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${E(p.initial)}</text><circle cx="${px}" cy="${py}" r="16" fill="transparent" data-tip="<b>${E(p.name)}</b><br>Resultado: ${fmt(db.dims[p.id].res)}<br>Aderência: ${fmt(idx(p.id))}<br>${QUAD[q][0]}"/>`});
 return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Resultado versus comportamento">${g}</svg></div>`}

/* ===================== Indicadores (KPIs) ===================== */
const KSRC={auto:['Calculado pela Pólen','green'],man:['Lançamento do líder/RH','blue'],int:['Integração · em breve','purple']};
function kpiLive(k){const L=k.ser.length-1;let v=k.ser[L];
 if(k.id==='k_cf'){const s=db.perception.scores[k.p];if(s!=null)v=s}
 if(k.id==='k_cli'){const a=Object.values(db.perception.scores);if(a.length)v=+avg(a).toFixed(1)}
 if(k.id==='k_nps')v=db.perception.enps;
 if(k.id==='k_evo')v=+(avg(db.people.map(p=>{const t=pTrend(p.id);return t.length?t[5]-t[0]:null}))??0).toFixed(1);
 if(k.id==='k_1on1')v=pct(db.people.filter(p=>oneOk(p.id)).length,db.people.length);
 if(k.id==='k_pdi')v=pct(db.plans.filter(x=>x.done).length,db.plans.length);
 if(k.id==='k_fba'){const a=avg(db.plans.filter(x=>x.done&&x.impact).map(x=>x.impact));v=a==null?0:+a.toFixed(1)}
 return {v,ser:[...k.ser.slice(0,L),v]}}
function kfmt(k,v){if(v==null)return '—';const n=String(+Number(v).toFixed(1)).replace('.',',');switch(k.u){case '%':return n+'%';case 'h':return n+'h';case 'sc':return fmt(v);case 'd':return fmtS(v);case 'pts':return (v>0?'+':'')+n;default:return n}}
const kOk=(k,v)=>k.dir==='up'?v>=k.t:v<=k.t;
function kcard(k){const {v,ser}=kpiLive(k),prev=ser[ser.length-2],dl=+(v-prev).toFixed(2),good=k.dir==='up'?dl>0:dl<0,ok=kOk(k,v);const dtxt=dl===0?'estável':`${dl>0?'▲':'▼'} ${kfmt({u:k.u==='%'?'n':k.u==='d'?'sc':k.u},Math.abs(dl))}${k.u==='%'?' p.p.':''} vs. mês anterior`;
 return `<div class="kcard"><div class="row between" style="align-items:flex-start;gap:8px"><div class="kl">${E(k.n)}</div>${tag(KSRC[k.src][0],KSRC[k.src][1])}</div><div class="row between" style="align-items:flex-end"><div><div class="kn">${kfmt(k,v)}</div><div class="xs ${dl===0?'muted':good?'up':'down'}" style="font-weight:700;margin-top:2px">${dtxt}</div></div>${spark(ser,'#1E7A57',96,34,k.dir==='down')}</div><div class="row between"><span class="xs muted">Meta ${kfmt(k,k.t)}</span>${ok?tag('Na meta','green'):tag('Fora da meta','orange')}</div></div>`}
const activeKpis=()=>db.kpis.filter(k=>k.on&&inModel(k.p));

function culture(){const m=db.model,M=m.manifesto,F=formulaOf();
 return `<div class="stack" style="gap:20px">${title(E(M.name),`Segmento: ${E(SEGNAME[m.segment])} · os padrões de comportamento que guiam avaliações, registros, alertas da IA e PDIs.`,`${tag('Versão '+db.versions,'green')}${actionBtn('Importar documento com IA','uploadCulture','btn2','upload')}${actionBtn('Modelar cultura','go:model','btn1','settings')}`)}

const lc=s=>s?s.charAt(0).toLowerCase()+s.slice(1):'';
const behFor=v=>{const b=(v.beh||[]).find(x=>x.on&&x.t==='e'&&!x.text.includes('?')&&!/^Pergunta/.test(x.text));return b?b.text:topBeh(v,1)};
const fullN=id=>value(id).name;

/* ---------- Pauta gerada a partir dos alertas ---------- */
function topicOf(a){
  const v=a.value?value(a.value):null,pid=a.person;
  if(a.type==='gap'&&v){const e=ev(pid,v.id)||[],att=recsOf(pid).find(r=>r.value===v.id&&r.kind==='atenção');
    return {text:`Percepção em ${v.name}: você se vê ${fmt(e[0])} e o time vê ${fmt(avg([e[1],e[2]]))}`,why:att?`Registro de ${dateS(att.date)}: ${att.desc}`:`${COL().peers?`Colegas ${fmt(e[1])} · líder ${fmt(e[2])}`:`Líder ${fmt(e[2])}`}. Sem registro de atenção recente`,ask:`Comportamento esperado: “${behFor(v)}”. Que exemplo recente você traria?`,v:v.id,pdi:true}}
  if(a.id.startsWith('low-')&&v){const e=ev(pid,v.id)||[];
    return {text:`Reconhecer força em ${v.name}`,why:`Você se avalia ${fmt(e[0])}, mas ${COL().peers?`colegas (${fmt(e[1])}) e líder (${fmt(e[2])})`:`o líder (${fmt(e[2])})`} enxerga mais`,ask:'O que você acha que o time enxerga em você aqui que você não costuma contar?',v:v.id}}
  if(a.id.startsWith('imp-')&&v){const pl=db.plans.find(x=>'imp-'+x.id===a.id);
    return {text:`Reconhecer a evolução em ${v.name} (${fmtS(pl?.impact)} após o PDI)`,why:`Ação concluída: ${pl?.title||''}`,ask:'O que mudou na sua rotina que explica essa melhora?',v:v.id}}
  if(a.type==='cultural'){const lo=v||[...db.values].map(x=>({v:x,a:adh(pid,x.id)})).filter(x=>x.a!=null).sort((x,y)=>x.a-y.a)[0]?.v;
    return {text:`Entrega forte, comportamento abaixo do esperado${lo?' em '+lo.name:''}`,why:a.why[0],ask:lo?`Comportamento esperado em ${lo.name}: “${behFor(lo)}”. Como as suas entregas podem refletir isso?`:'Que comportamentos do time você acha que ficam em segundo plano quando o prazo aperta?',v:lo?.id||'',pdi:!!lo}}
  if(a.id.startsWith('late-')){const pl=db.plans.find(x=>'late-'+x.id===a.id);
    return {text:`PDI atrasado: ${pl?.title||''}`,why:`Venceu em ${dateF(pl?.due)}. Entender a barreira antes de cobrar o prazo`,ask:'O que travou e que apoio você precisa para concluir?',v:pl?.value||''}}
  return null}

function genAgenda(pid){
  const items=[];let n=0;const add=t=>items.push({id:'t'+(++n),on:true,v:'',ask:'',why:'',...t});
  baseAlerts().filter(a=>a.person===pid&&/^(gap|cult|low|imp|late)-/.test(a.id)).slice(0,4).forEach(a=>{const t=topicOf(a);if(t)add({...t,alert:a.id})});
  const last=db.meetings.filter(m=>m.person===pid&&m.closed&&m.notes).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(last)add({text:`Retomar o combinado de ${dateS(last.date)}`,why:last.notes,ask:'O que já avançou e o que ficou pendente?'});
  const op=db.plans.find(x=>x.person===pid&&!x.done&&x.due>=TODAY);
  if(op&&!items.some(i=>i.text.includes(op.title)))add({text:`Acompanhar o PDI: ${op.title}`,why:`Prazo em ${dateS(op.due)}`,ask:'Como está o andamento e o que pode ajudar?',v:op.value});
  if(!items.length){const pos=recsOf(pid).find(r=>r.kind==='positivo');
    add(pos?{text:`Reconhecer: ${pos.desc}`,why:`Registro de ${dateS(pos.date)} em ${fullN(pos.value)}`,ask:'Como você enxerga esse resultado?',v:pos.value}:{text:'Sem alertas para esta pessoa. Use a 1:1 para ouvir',why:'Nenhum gap, atraso ou ponto cego identificado',ask:'O que está indo bem e o que está pesando?'})}
  return items}

function agendaOf(m){if(!m.agenda)m.agenda=genAgenda(m.person);return m.agenda}

/* ---------- Alertas: inclui pauta de 1:1 não confirmada ---------- */
function buildAlerts(){
  const out=baseAlerts();
  db.meetings.filter(m=>!m.closed&&!m.confirmed).forEach(m=>{
    const dd=daysBetween(TODAY,m.date);if(dd>3)return;const id='pauta-'+m.id;if(S.alertState[id]==='x')return;
    const p=person(m.person),n=agendaOf(m).length;
    out.push({id,type:'pauta',sev:dd<=0?'alta':'media',person:m.person,title:`Pauta da 1:1 com ${p.name} ainda não foi confirmada`,why:[`1:1 ${dd<=0?'hoje':dd===1?'amanhã':'em '+dateF(m.date)} às ${m.time}`,`${n} tópico(s) sugeridos pela IA aguardam a sua revisão`],acts:[['Revisar pauta',`review:${m.id}`]]})});
  const order={alta:0,media:1,boa:2};
  return out.sort((a,b)=>(S.alertState[a.id]==='ok')-(S.alertState[b.id]==='ok')||order[a.sev]-order[b.sev])}

function alertShort(a){
  if(a.type==='gap')return `Gap em ${fullN(a.value)}`;
  if(a.type==='cultural')return 'Resultado × cultura';
  if(a.type==='ponto')return 'Ponto cego';
  if(a.type==='pauta')return 'Pauta não confirmada';
  if(a.id.startsWith('late-'))return 'PDI atrasado';
  if(a.id.startsWith('one-'))return 'Sem 1:1 recente';
  if(a.id.startsWith('self-'))return 'Sem autoavaliação';
  return a.title}

/* ---------- Respostas da coleta + análise da IA ---------- */
function respComment(v,src,sc){const b=behFor(v),f=sc>=4.3?0:sc>=3.6?1:2;
  const T={self:['faço quase sempre','faço na maioria das vezes','faço raramente'],other:['observado quase sempre','observado na maioria das vezes','observado raramente']}[src==='self'?'self':'other'];
  return `Sobre “${b}”: ${T[f]}.`}
function respAnalysis(pid,src){
  const nm=person(pid).name.split(' ')[0],ps=db.values.map(v=>{const e=ev(pid,v.id)||[];return {v,s:e[0],p:e[1],l:e[2],t:avg([e[1],e[2]])}}).filter(x=>x.t!=null);
  const mg=maxGap(pid),L=[];
  if(src==='self'){
    const top=[...ps].sort((a,b)=>b.s-a.s)[0];
    if(top)L.push(`${nm} se vê mais forte em ${top.v.name} (${fmt(top.s)}).`);
    if(mg&&mg.g>=CFG().gap)L.push(`Maior distância para o time: ${mg.v.name}: a autoavaliação é ${fmt(ev(pid,mg.v.id)[0])} e o time vê ${fmt(avg([ev(pid,mg.v.id)[1],ev(pid,mg.v.id)[2]]))} (gap ${fmtS(mg.g)}).`,'Vale levar exemplos concretos para a 1:1.');
    else if(mg&&mg.g<=-CFG().gap)L.push(`${nm} se subestima em ${mg.v.name}: o time vê mais do que ela. Bom ponto de reconhecimento.`);
    else L.push('A autoavaliação está alinhada com a visão do time.')}
  if(src==='peer'){
    const hi=[...ps].sort((a,b)=>b.p-a.p)[0],lo=[...ps].sort((a,b)=>a.p-b.p)[0];
    L.push(`Colegas veem ${nm} mais forte em ${hi.v.name} (${fmt(hi.p)}) e com mais espaço em ${lo.v.name} (${fmt(lo.p)}).`);
    const dv=[...ps].sort((a,b)=>Math.abs(b.p-b.l)-Math.abs(a.p-a.l))[0];
    if(Math.abs(dv.p-dv.l)>=.5)L.push(`Colegas (${fmt(dv.p)}) e líder (${fmt(dv.l)}) divergem em ${dv.v.name}. Falta evidência observável de um dos lados.`);
    else L.push('Colegas e líder estão alinhados entre si.')}
  if(src==='lead'){
    const lo=[...ps].sort((a,b)=>a.l-b.l)[0],hi=[...ps].sort((a,b)=>b.l-a.l)[0];
    L.push(`Na sua avaliação, o ponto forte é ${hi.v.name} (${fmt(hi.l)}) e o de maior atenção é ${lo.v.name} (${fmt(lo.l)}).`);
    const d=db.dims[pid];if(d&&db.model.dims.some(x=>x.on&&x.id==='res'))L.push(`Resultado ${fmt(d.res)} · Qualidade ${fmt(d.qual)}, também notas suas.`)}
  return L}
const FREQ=['Nunca','Raramente','Às vezes','Quase sempre','Sempre'];
const clamp5=x=>Math.max(1,Math.min(5,Math.round(x)));
function dots(n,good){const col=good?'#1E7A57':'#C08A1E';return `<span style="display:inline-flex;gap:3px;vertical-align:middle">${[1,2,3,4,5].map(i=>`<i style="width:9px;height:9px;border-radius:50%;background:${i<=n?col:'#E0DCD0'}"></i>`).join('')}</span>`}
function formAnswers(pid,v,src,sc){
  const nm=person(pid).name.split(' ')[0],subj=src==='self'?'você':nm,esp=src==='peer'?3:1;
  return (v.beh||[]).filter(b=>b.on&&!b.text.includes('?')&&!/^Pergunta/.test(b.text)).map(b=>{
    const base=b.t==='e'?sc:6-sc,no=(hash(pid+b.id+src)%3)-1,n=clamp5(base+no*.8),good=b.t==='e'?n>=4:n<=2,avoid=b.t==='a';
    const avg2=Math.max(1,Math.min(5,+(base+no*.5).toFixed(1)));
    return {q:b.t==='a'?`Com que frequência acontece de ${subj} ${lc(b.text)}?`:`Com que frequência ${subj} ${lc(b.text)}?`,n:src==='peer'?clamp5(avg2):n,avg:avg2,good,avoid}})}
function peerComment(pid,v,sc){const nm=person(pid).name.split(' ')[0],b=lc(behFor(v));
  return sc>=4.3?`${nm} ${b} com consistência.`:sc>=3.6?`${nm} geralmente ${b}, mas falta constância.`:`${nm} nem sempre ${b}.`}
