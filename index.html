const scaleField=(v,def)=>`<div class="field"><label><span class="dot-c" style="background:${vcolor(v)}"></span>${E(v.name)}</label><div class="hint" style="margin:-3px 0 8px">${E(topBeh(v,2))}</div><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="s_${v.id}" value="${n}" ${n===def?'checked':''} required><span>${n}</span></label>`).join('')}</div></div>`;
function modal(t,desc,content,form,submit='Salvar',drawer=true,wide=false){return `<div class="modal-layer ${drawer?'':'modal-center'}" data-backdrop="1"><div class="${drawer?'drawer'+(wide?' wide':''):'dialog'}" role="dialog" aria-modal="true" aria-label="${E(t)}"><div class="modal-head"><div><h2 class="h2">${t}</h2><p class="sub">${desc}</p></div><button class="close" data-action="closeModal" aria-label="Fechar">${icon('x')}</button></div><form id="modalform" data-form="${form}"><div class="modal-body"><div class="stack" style="gap:17px">${content}</div></div><div class="modal-footer"><button class="btn2" type="button" data-action="closeModal">${submit?'Cancelar':'Fechar'}</button>${submit?`<button class="btn1" type="submit">${icon('check',15)} ${E(submit)}</button>`:''}</div></form></div></div>`}
const behOptions=pid=>{const v=db.values.find(x=>x.id===pid);if(!v)return '<option value="">—</option>';const o=(t,l)=>l.length?`<optgroup label="${t}">${l.map(b=>`<option value="${b.id}">${E(b.text)}</option>`).join('')}</optgroup>`:'';return '<option value="">—</option>'+o('Esperados',v.beh.filter(b=>b.on&&b.t==='e'))+o('A evitar',v.beh.filter(b=>b.on&&b.t==='a'))};
const dimFields=(m,pid)=>m!=='evalL'?'':db.model.dims.filter(d=>d.on&&(d.id==='res'||d.id==='qual')).map(d=>`<div class="field"><label>${E(d.t)} <span class="chip gray" style="margin-left:6px">dimensão</span></label><div class="hint" style="margin:-3px 0 8px">${E(d.q)}</div><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="d_${d.id}" value="${n}" ${n===Math.round(db.dims[pid]?.[d.id]||0)?'checked':''} required><span>${n}</span></label>`).join('')}</div></div>`).join('');
const stepName=id=>db.model.cycle.find(c=>c.id===id)?.t||'';
function renderModal(){const m=S.modal;if(!m)return '';
if(m==='newRecord'){const v0=db.values[0];return modal('Novo registro','Descreva um fato observável, não um rótulo.',`<div class="grid g2"><div class="field"><label>Colaborador</label>${selPeople(S.selected)}</div><div class="field"><label>Data</label><input class="fin" name="date" type="date" value="${TODAY}" required></div></div><div class="grid g2"><div class="field"><label>Tipo</label><select class="fin" name="kind"><option value="positivo">Positivo · reconhecer</option><option value="atenção">Para conversar</option></select></div><div class="field"><label>Pilar da cultura</label>${selValues(v0.id)}</div></div><div class="grid g2"><div class="field"><label>Comportamento (opcional)</label><select class="fin" name="beh">${behOptions(v0.id)}</select></div>${db.model.cycle.some(c=>c.on)?`<div class="field"><label>Etapa do ciclo (opcional)</label><select class="fin" name="step"><option value="">—</option>${db.model.cycle.filter(c=>c.on).map(c=>`<option value="${c.id}">${E(c.t)}</option>`).join('')}</select></div>`:''}</div><div class="field"><label>O que aconteceu?</label><textarea class="fin" name="desc" required minlength="12" placeholder="Ex.: Na entrega de terça, avisou o time com antecedência sobre um impedimento…"></textarea><button type="button" class="btn2 btn-sm" data-action="sampleAudio" style="margin-top:10px">${icon('mic',15)} Ditar por áudio</button></div><div class="field"><label>Contexto (opcional)</label><textarea class="fin" name="context" rows="2"></textarea></div><label class="row small"><input type="checkbox" name="shared"> Compartilhar com o colaborador</label>`,'saveRecord','Salvar registro')}
if(m==='uploadCulture'){const cand=LIB.filter(l=>!inModel(l.id)).slice(0,2);const body=S.up===0?`<div class="drop">${icon('upload',30)}<p style="margin:10px 0 4px"><b>Arraste o manual de cultura, código de conduta ou apresentação institucional</b></p><p class="xs muted">PDF, DOCX ou PPTX</p><button type="button" class="btn1 btn-sm" style="margin-top:12px" data-action="upNext">Simular envio: Codigo_de_Cultura_Delta.docx</button></div>`:S.up===1?`<div class="drop">${icon('spark',30)}<p><b>Lendo o documento…</b></p><div class="progress" style="max-width:260px;margin:10px auto"><div style="width:70%"></div></div><p class="xs muted">Identificando pilares, comportamentos, princípios e indicadores</p></div>`:`<div class="notice mint">${icon('check')} <div>A IA reconheceu <b>${db.values.length} pilares</b>, ${db.model.principles.filter(x=>x.on).length} princípios e ${db.model.cycle.filter(x=>x.on).length} etapas do ciclo, todos já presentes no seu Código.${cand.length?' Encontrou também menções a estes temas:':''}</div></div>${cand.map(l=>`<label class="sug"><input type="checkbox" name="u_${l.id}" checked><div><b class="small">${E(l.name)}</b><p class="sub" style="margin:3px 0">${E(l.desc)}</p><div class="hint">${l.esp.filter(x=>x[1]).length} comportamentos sugeridos</div></div></label>`).join('')}`;return modal('Importar cultura com IA','Envie o documento e a IA sugere pilares e comportamentos. Você revisa antes de salvar.',body,'saveUpload',S.up===2&&cand.length?'Adicionar selecionados':'')}
if(m==='libPick'){const rest=MAX_PILLARS-db.values.length,cand=LIB.filter(l=>!inModel(l.id));return modal('Adicionar pilar','Escolha da biblioteca ou crie o seu.',`<div class="notice ${rest>0?'':'amber'}">${icon('info')} ${rest>0?`Você pode adicionar mais ${rest} pilar(es).`:`O modelo já tem ${MAX_PILLARS} pilares. Remova um para adicionar outro.`}</div>${cand.map(l=>`<label class="sug"><input type="checkbox" name="lib_${l.id}"><div><b class="small">${E(l.name)}</b><div style="margin:5px 0;display:flex;gap:5px;flex-wrap:wrap">${l.seg.slice(0,3).map(x=>tag(SEGNAME[x],'gray')).join('')}</div><p class="sub" style="margin:3px 0">${E(l.desc)}</p><div class="hint">${l.esp.length+l.evi.length} comportamentos na biblioteca · ${l.esp.filter(x=>x[1]).length+l.evi.filter(x=>x[1]).length} ativos por padrão</div></div></label>`).join('')}<div class="field"><label>Ou crie um pilar do zero</label><input class="fin" name="custom" placeholder="Nome do novo pilar"></div>`,'saveLib','Adicionar')}
if(m==='confirmTpl'){const sg=SEGS.find(x=>x.id===S.temp)||SEGS[0];return modal('Aplicar modelo',E(sg.name),`<div class="notice amber">${icon('alert')} <div>Isso substitui os pilares, indicadores e a declaração de cultura atuais pelos do modelo “${E(sg.name)}”. A declaração de cultura também recebe os textos sugeridos do modelo. Os parâmetros ficam como estão.</div></div><p class="small muted" style="line-height:1.6">Pilares do modelo: ${sg.pillars.map(p=>E(LIBID[p].name)).join(', ')||'um pilar em branco'}.</p><p class="hint">No protótipo, pilares novos recebem notas simuladas para você explorar as telas. Para voltar ao ambiente da Delta, use “Restaurar modelo da Delta”.</p>`,'saveTpl','Aplicar modelo',false)}
if(m==='kpiEntry'){const ks=activeKpis().filter(k=>k.src!=='auto');return modal('Lançar indicadores · Nov/26','Indicadores que não nascem na Pólen. Lance o valor do mês ou importe um CSV.',`<div class="row"><button type="button" class="btn2 btn-sm" data-action="csvKpi">${icon('upload',14)} Importar CSV (simulado)</button></div>${ks.map(k=>`<div class="field"><label>${E(k.n)} <span class="muted xs">· ${E(vn(value(k.p)))}</span></label><div class="row"><input class="fin" type="number" step="any" name="kv_${k.id}" value="${kpiLive(k).v}" style="max-width:130px"><span class="xs muted">${k.u==='%'?'%':k.u==='h'?'horas':k.u==='sc'?'nota 1–5':k.u==='pts'?'pontos':'quantidade'} · meta ${kfmt(k,k.t)}</span>${tag(KSRC[k.src][0],KSRC[k.src][1])}</div></div>`).join('')||'<p class="sub">Nenhum indicador ativo depende de lançamento.</p>'}<div class="notice">${icon('info')} Depois do MVP, os indicadores marcados “Integração” virão direto de Jira, GitHub e ferramentas de incidentes.</div>`,'saveKpi','Salvar lançamentos')}
if(m==='metrics')return modal('Como calculamos','Fórmula e fonte de cada métrica. Os parâmetros vêm do seu modelo de cultura.',metricsBody(),'noop','',true,true);
if(m==='newMeeting')return modal('Agendar 1:1','A pauta é montada pela IA a partir do Raio-X.',`<div class="field"><label>Colaborador</label>${selPeople(S.selected)}</div><div class="grid g2">${control('Data','date',addDays(TODAY,4),'name="date" required')}${control('Horário','time','09:00','name="time" required')}</div>`,'saveMeeting','Agendar');
if(m==='meetingNotes')return modal('Registrar combinados','O que foi acordado com a pessoa.',`<div class="field"><label>Acordos e próximos passos</label><textarea class="fin" name="notes" required>${E(db.meetings.find(x=>x.id===S.meeting)?.notes||'')}</textarea></div>`,'saveNotes','Salvar');
if(m==='reviewAgenda')return reviewModal();
if(m==='respView')return respViewModal();
if(m==='fbModal')return fbModal();
if(m==='pdiAI'){const d=S.pdiDraft||pdiSuggest(S.selected);S.pdiDraft=d;return modal('Gerar PDI com IA','Ações sugeridas a partir do Raio-X e do Código de Cultura. Edite à vontade.',`<div class="notice">${icon('calendar')} PDI gerado a partir da 1:1 de ${dateF((db.meetings.find(q=>q.id===d.meeting)||{}).date)} com <b>&nbsp;${E(person(d.person).name)}</b>.</div><div class="notice">${icon('spark')} Foco em <b>&nbsp;${E(value(d.value).name)}&nbsp;</b> por ser o ${E(d.reason)}.</div>${d.items.map((x,i)=>`<div class="sug"><input type="checkbox" name="k${i}" checked><div class="grow"><input class="fin" name="t${i}" value="${E(x.title)}"><div class="row" style="margin-top:7px"><span class="xs muted">Prazo</span><input class="fin" type="date" name="d${i}" value="${x.due}" style="width:160px;min-height:32px;padding:5px 8px"></div></div></div>`).join('')}${principle()}`,'savePdi','Adicionar ao PDI')}
if(m==='newPlan')return modal('Nova ação de desenvolvimento','Uma ação concreta para acompanhar nas 1:1.',`<div class="field"><label>Colaborador</label>${selPeople(S.selected)}</div><div class="field"><label>Ação</label><textarea class="fin" name="title" required></textarea></div><div class="grid g2"><div class="field"><label>Valor</label>${selValues('autorresp')}</div>${control('Prazo','date',addDays(TODAY,21),'name="due" required')}</div>`,'savePlan','Criar ação');
if(m==='evalL'||m==='evalSelf'){const pid=m==='evalL'?S.temp:S.portal,p=person(pid),k=m==='evalL'?2:0;return modal(m==='evalL'?`Sua avaliação · ${E(p.name)}`:'Minha autoavaliação',`${E(cycle().name)} · de 1 (raramente) a 5 (sempre e é referência)`,db.values.map(v=>scaleField(v,Math.round(ev(pid,v.id)?.[k]??ev(pid,v.id)?.[1]??0))).join('')+dimFields(m,pid)+`<div class="field"><label>Comentário (opcional)</label><textarea class="fin" name="comment" rows="2" placeholder="Um exemplo que justifique sua percepção"></textarea></div>`,m==='evalL'?'saveEvalL':'saveEvalSelf','Enviar avaliação')}
if(m==='evalPeer')return modal('Avaliar colega','Anônimo. Seu nome nunca aparece para a pessoa avaliada.',`<div class="field"><label>Colega sorteado</label>${selPeople(S.portal==='e2'?'e6':'e2','peer',S.portal)}</div>${db.values.map(v=>scaleField(v,0)).join('')}`,'saveEvalPeer','Enviar');
if(m==='newCycle'){const C=COL(),st='2027-02-01',dl=new Date(new Date(st).getTime()+C.deadlineDays*864e5).toISOString().slice(0,10);return modal('Novo ciclo de avaliação','Usa o modelo de coleta da sua empresa. Ajuste em Modelar cultura → Coleta.',`<div class="field"><label>Nome</label><input class="fin" name="name" value="Ciclo de Cultura · Fev/27" required></div><div class="field"><label>Fontes</label><div class="stack" style="gap:6px"><label class="row small"><input type="checkbox" checked disabled> Autoavaliação</label>${C.peers?`<label class="row small"><input type="checkbox" checked disabled> Colegas (${C.peerCount} sorteado(s), anônimo)</label>`:''}<label class="row small"><input type="checkbox" checked disabled> Líder</label></div></div><div class="grid g2">${control('Início','date',st,'name="start"')}${control('Prazo','date',dl,'name="deadline" required')}</div>`,'saveCycle','Agendar ciclo')}
if(m==='newEmployee')return modal('Novo colaborador','Ele recebe acesso ao portal e entra no próximo ciclo.',`<div class="field"><label>Nome completo</label><input class="fin" name="name" required></div><div class="field"><label>Cargo</label><input class="fin" name="role" required></div><div class="field"><label>Área</label><select class="fin" name="team"><option>Backend</option><option>Frontend</option><option>Plataforma</option><option>Qualidade</option></select></div>`,'saveEmployee','Cadastrar');
if(m==='context')return modal('Minha perspectiva','Entra no Raio-X como contexto para o líder.',`<div class="field"><label>Comentário</label><textarea class="fin" name="context" required placeholder="Conquistas, impedimentos, recursos de que preciso…"></textarea></div>`,'saveContext','Enviar',false);
return ''}

/* ===== Ações ===== */
function go(screen,tab){if(tab){if(screen==='dash')S.dashTab=tab;if(screen==='dev')S.devTab=tab;if(screen==='collect')S.collectTab=tab;if(screen==='model')S.modelTab=tab}nav(screen)}
function handleAction(a){const [k,x,y,z]=a.split(':');
switch(k){
case 'go':return go(x,y);
case 'closeModal':return closeModal();
case 'metrics':return openModal('metrics');
case 'kpiEntry':return openModal('kpiEntry');
case 'libPick':return openModal('libPick');
case 'applyTpl':S.temp=x;return openModal('confirmTpl');
case 'colPreset':db.model.collect={...COLLECT_PRESETS[x]};render();return toast('Modelo de coleta aplicado');
case 'sugMan':applyManifesto(db.model.segment);render();return toast('Textos sugeridos pelo modelo. Edite à vontade');
case 'restoreDelta':applyTemplate('tech');Object.assign(db.model.manifesto,DELTA_MANIFESTO);Object.assign(db.model.cfg,DELTA_CFG);S.modelTab='seg';render();return toast('Modelo da Delta restaurado');
case 'addBeh':{const t=($('#nb-'+x+'-'+y)?.value||'').trim();if(!t)return toast('Escreva o comportamento');value(x).beh.push({id:x+'-c'+Date.now(),t:y,text:t,on:true,custom:true});return render()}
case 'rmBeh':{const v=value(x);v.beh=v.beh.filter(b=>b.id!==y);return render()}
case 'rmPillar':{if(db.values.length<=MIN_PILLARS)return toast(`O modelo precisa de ao menos ${MIN_PILLARS} pilares`);db.values=db.values.filter(v=>v.id!==x);db.versions++;render();return toast('Pilar removido. Avaliações antigas ficam guardadas')}
case 'addItem':{const t=($('#ni-'+x)?.value||'').trim();if(!t)return toast('Escreva o nome do item');({prin:db.model.principles,cyc:db.model.cycle,lead:db.model.leadership})[x].push({id:x+Date.now(),t:x==='cyc'?t.toUpperCase():t,d:'',on:true,custom:true});ensureDemoData();return render()}
case 'csvKpi':{let n=0;document.querySelectorAll('#modalform input[name^="kv_"]').forEach(i=>{const k=db.kpis.find(z=>z.id===i.name.slice(3));if(k){const c=Number(i.value);i.value=+(c+(k.t-c)*.25).toFixed(1);n++}});return toast(`indicadores_nov26.csv lido: ${n} indicadores preenchidos (simulado)`)}
case 'login':return nav('home');
case 'logout':return nav('login');
case 'more':S.menuOpen=!S.menuOpen;return render();
case 'sampleAudio':{const f=$('#modalform textarea[name="desc"]');if(f){f.value='Na reunião de terça, identificou um risco de prazo e avisou a equipe com antecedência, já sugerindo uma alternativa.';toast('Áudio transcrito (simulação)')}return}
case 'newRecordSel':return openModal('newRecord');
case 'rec':S.selected=x;return openModal('newRecord');
case 'sched':S.selected=x;return openModal('newMeeting');
case 'prep':{S.selected=x;const m=nextOne(x);if(m){S.meeting=m.id;return go('dev','oneone')}openModal('newMeeting');return}
case 'review':{const m=db.meetings.find(q=>q.id===Number(x));if(!m)return;S.rev=m.id;S.selected=m.person;return openModal('reviewAgenda')}
case 'rmTopic':{const m=captureAgenda();m.agenda=m.agenda.filter(q=>q.id!==x);return openModal('reviewAgenda')}
case 'addTopic':{const m=captureAgenda();m.agenda.push({id:'c'+Date.now(),on:true,text:'',why:'',ask:'',v:'',custom:true});return openModal('reviewAgenda')}
case 'regenAgenda':{const m=db.meetings.find(q=>q.id===S.rev);m.agenda=null;m.confirmed=false;toast('Pauta regenerada a partir dos alertas atuais');return openModal('reviewAgenda')}
case 'view':S.rv={pid:y,src:x};return openModal('respView');
case 'cyc':S.cycleSel=Number(x);return render();
case 'fbHere':{const m=db.meetings.find(q=>q.id===S.meeting);if(!m)return;const v=(agendaOf(m).find(t=>t.v)||{}).v||db.values[0].id;S.fb={person:m.person,meeting:m.id,value:v,...fbDraft(m.person,v)};return openModal('fbModal')}
case 'pdi':{const r=pdiReady(x).find(q=>y&&q.v===y&&(!z||q.m.id===Number(z)));if(!r){toast('O PDI é gerado depois da 1:1 que trata o ponto. Prepare e conclua a 1:1 antes.');return}S.pdiDraft={...pdiSuggest(x,r.v),meeting:r.m.id};return openModal('pdiAI')}
case 'pdiSel':case 'pdiAI':{const r=pdiReady(S.selected)[0];return handleAction('pdi:'+S.selected+':'+(r?r.v+':'+r.m.id:'none'))}
case 'fb':{const m=nextOne(x)||db.meetings.filter(q=>q.person===x).sort((a,b)=>b.date.localeCompare(a.date))[0],v=y||db.values[0].id;S.selected=x;S.fb={person:x,meeting:m?.id,value:v,...fbDraft(x,v)};return openModal('fbModal')}
case 'fbAI':{const sv=$('#fbm-value');if(sv)S.fb.value=sv.value;const f=$('#modalform');Object.assign(S.fb,fbDraft(S.fb.person,S.fb.value));openModal('fbModal');return toast('Preenchido a partir do registro mais recente. Revise antes de salvar')}
case 'evalL':S.temp=x;return openModal('evalL');
case 'remind':return toast(`Lembrete enviado para ${person(x).name} por e-mail e WhatsApp`);
case 'remindAll':return toast('Lembretes enviados a todos os pendentes');
case 'done':{const p=db.plans.find(z=>z.id===Number(x));if(p)p.done=true;render();return toast('Ação marcada como concluída')}
case 'closeMeeting':{const m=db.meetings.find(z=>z.id===S.meeting);if(m){m.topics=[...new Set(agendaOf(m).filter(t=>t.pdi&&t.v).map(t=>t.v))];m.closed=true;m.date=m.date>TODAY?TODAY:m.date;render();return toast(m.topics.length?'Reunião concluída. Já é possível gerar o PDI do ponto conversado':'Reunião concluída')}return}
case 'upNext':S.up=1;openModal('uploadCulture');setTimeout(()=>{if(S.modal==='uploadCulture'){S.up=2;openModal('uploadCulture')}},1500);return;
case 'sendAI':{const q=($('#ai-input')?.value||'').trim();if(!q)return;S.copilot.push({who:'me',text:q},{who:'ai',text:simulatedAi(q)});S.draftAI='';return render()}
case 'export':{const rows=['Colaborador;Area;Aderencia;Maior gap;Ultimo registro (dias);Ultima 1:1 (dias)',...db.people.map(p=>{const g=maxGap(p.id);return [p.name,p.team,fmt(idx(p.id)),g?g.v.name+' '+fmtS(g.g):'',lastRec(p.id)??'',lastOne(p.id)??''].join(';')})].join('\n');const url=URL.createObjectURL(new Blob(['﻿'+rows],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=url;l.download='cria-indicadores.csv';l.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return toast('CSV exportado')}
default:if(['newRecord','newCulture','uploadCulture','newMeeting','meetingNotes','newPlan','evalSelf','evalPeer','newCycle','newEmployee','context'].includes(k)){if(k==='uploadCulture')S.up=0;return openModal(k)}}}
function scores(d){const o={};db.values.forEach(v=>{if(d['s_'+v.id])o[v.id]=Number(d['s_'+v.id])});return o}
function submitForm(name,form){const d=Object.fromEntries(new FormData(form));
if(name==='saveRecord'){db.records.unshift({id:Date.now(),person:d.person,value:d.value,beh:d.beh||null,step:d.step||null,kind:d.kind,date:d.date,desc:d.desc.trim(),context:(d.context||'').trim(),shared:d.shared==='on',source:'Plataforma'});S.selected=d.person;return done('Registro salvo · Raio-X atualizado')}
if(name==='saveUpload'){LIB.forEach(l=>{if(d['u_'+l.id]&&db.values.length<MAX_PILLARS&&!inModel(l.id)){addPillar(mkPillar(l));db.kpis.forEach(k=>{if(k.p===l.id&&k.def)k.on=true})}});db.versions++;ensureDemoData();S.up=0;return done('Pilares importados e adicionados ao modelo')}
if(name==='saveLib'){let rest=MAX_PILLARS-db.values.length,n=0;LIB.forEach(l=>{if(d['lib_'+l.id]&&rest>0&&!inModel(l.id)){addPillar(mkPillar(l));db.kpis.forEach(k=>{if(k.p===l.id&&k.def)k.on=true});rest--;n++}});const nm=(d.custom||'').trim();if(nm&&rest>0){addPillar(mkPillar({id:'x'+Date.now(),name:nm,short:nm.slice(0,18),desc:'Descreva o padrão de comportamento esperado.',ic:'spark',esp:[],evi:[]}));n++}if(n){db.versions++;ensureDemoData()}return done(n?`${n} pilar(es) adicionado(s)`:'Nenhum pilar selecionado')}
if(name==='saveTpl'){applyTemplate(S.temp);applyManifesto(S.temp);S.modelTab='pil';return done('Modelo aplicado. Pilares novos usam notas simuladas')}
if(name==='saveKpi'){Object.entries(d).forEach(([key,val])=>{if(!key.startsWith('kv_')||val==='')return;const k=db.kpis.find(z=>z.id===key.slice(3));if(k)k.ser[k.ser.length-1]=Number(val)});return done('Indicadores de novembro atualizados')}
if(name==='saveEvalL'){db.dims[S.temp]=db.dims[S.temp]||{};if(d.d_res)db.dims[S.temp].res=Number(d.d_res);if(d.d_qual)db.dims[S.temp].qual=Number(d.d_qual)}
if(name==='saveMeeting'){const id=Date.now();db.meetings.push({id,person:d.person,date:d.date,time:d.time,notes:'',closed:false,confirmed:false});S.meeting=id;S.devTab='oneone';S.screen='dev';return done('1:1 agendada. Revise e confirme a pauta gerada pela IA')}
if(name==='saveAgenda'){const m=db.meetings.find(z=>z.id===S.rev);m.agenda=agendaOf(m).map(x=>({...x,text:(d['tx_'+x.id]??x.text).trim(),why:(d['wy_'+x.id]??x.why).trim(),ask:(d['as_'+x.id]??x.ask).trim()})).filter(x=>x.text);m.confirmed=true;S.meeting=m.id;return done('Pauta confirmada. Tudo certo para a 1:1')}
if(name==='saveFb'){const f=S.fb;if(!(d.c||'').trim()){toast('Preencha ao menos o comportamento');return}db.feedbacks.push({id:Date.now(),person:f.person,meeting:f.meeting,value:f.value,date:TODAY,s:d.s||'',c:d.c,i:d.i||'',shared:!!d.shared});return done(d.shared?'Feedback registrado e compartilhado no portal do colaborador':'Feedback registrado na 1:1')}
if(name==='saveNotes'){const m=db.meetings.find(z=>z.id===S.meeting);if(m)m.notes=d.notes.trim();return done('Combinados registrados')}
if(name==='savePdi'){const p=S.pdiDraft;let n=0;p.items.forEach((x,i)=>{if(d['k'+i]){db.plans.push({id:Date.now()+i,person:p.person,title:d['t'+i],due:d['d'+i],done:false,value:p.value,origin:'IA',meeting:p.meeting});n++}});S.pdiDraft=null;return done(`${n} ação(ões) adicionadas ao PDI de ${person(p.person).name}`)}
if(name==='savePlan'){db.plans.push({id:Date.now(),person:d.person,title:d.title.trim(),due:d.due,done:false,value:d.value,origin:'Líder'});return done('Ação criada')}
if(name==='saveEvalL'||name==='saveEvalSelf'){const pid=name==='saveEvalL'?S.temp:S.portal,k=name==='saveEvalL'?2:0,sc=scores(d);db.evals[pid]=db.evals[pid]||{};Object.entries(sc).forEach(([vid,n])=>{db.evals[pid][vid]=db.evals[pid][vid]||[null,null,null];db.evals[pid][vid][k]=n});const st=cycle().st[pid];if(st){if(k===2)st.l=1;else st.a=1}return done(k===2?`Avaliação de ${person(pid).name} enviada · Raio-X recalculado`:'Autoavaliação enviada. Obrigado!')}
if(name==='saveEvalPeer'){const st=cycle().st[d.peer];if(st&&st.p[0]<st.p[1])st.p[0]++;return done('Avaliação anônima enviada')}
if(name==='saveCycle'){db.cycles.push({id:Date.now(),name:d.name,status:'Agendado',deadline:d.start,sources:[]});return done('Ciclo agendado')}
if(name==='saveEmployee'){const id='e'+Date.now(),ini=d.name.trim().split(/\s+/).slice(0,2).map(z=>z[0].toUpperCase()).join('');db.people.push({id,name:d.name.trim(),role:d.role.trim(),team:d.team,initial:ini,tone:'pale',join:dateF(TODAY)});cycle().st[id]={a:0,p:[0,3],l:0};S.selected=id;S.screen='employee';return done('Colaborador cadastrado')}
if(name==='saveContext')return done('Perspectiva enviada ao líder')}
function done(msg){S.modal='';render();toast(msg)}

/* ===== Infra ===== */
function nav(s){S.screen=s;S.menuOpen=false;if(s==='employee')S.rxTab=S.rxTab||'raiox';render(true)}
function render(top=false){const m=$('#main'),pos=m?.scrollTop||0;$('#app').innerHTML=shell();const o=$('#overlay');if(o){o.innerHTML=renderModal();fitAreas(o)}if(isMob()){mobileTables();document.querySelectorAll('.tabs2').forEach(t=>{const a=t.querySelector('.tab2.on');if(a&&t.scrollWidth>t.clientWidth)t.scrollLeft=Math.max(0,a.offsetLeft-30)})}updateShorts();{const t=document.querySelector('.topnav'),a=t&&t.querySelector('.navt.active');if(a&&t.scrollWidth>t.clientWidth)t.scrollLeft=Math.max(0,a.offsetLeft-24)}if($('#main'))$('#main').scrollTop=top?0:pos;const c=$('#chatbox');if(c)c.scrollTop=c.scrollHeight;const w=$('#wa-body');if(w)w.scrollTop=w.scrollHeight}
function updateShorts(){$('#shortcuts').innerHTML=[...NAV,...MORE,['login','Tela de acesso']].map(([k,l])=>`<button data-nav="${k}" class="${S.screen===k||(k==='team'&&S.screen==='employee')?'active':''}">${E(l)}</button>`).join('')}
function toast(msg){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#app').appendChild(t);clearTimeout(toast.t);toast.t=setTimeout(()=>t.remove(),3300)}
function openModal(k){S.modal=k;const o=$('#overlay');if(o){o.innerHTML=renderModal();fitAreas(o)}}
function closeModal(){S.modal='';S.up=0;const o=$('#overlay');if(o)o.innerHTML=''}
document.addEventListener('click',e=>{const bd=e.target.closest('[data-backdrop]');if(bd&&e.target===bd)return closeModal();if(S.menuOpen&&!e.target.closest('[data-action="more"]')&&!e.target.closest('[data-nav]')){S.menuOpen=false;render()}
const el=e.target.closest('[data-alert],[data-nav],[data-action],[data-person],[data-rxtab],[data-ctab],[data-devtab],[data-dtab],[data-afilter],[data-recfilter],[data-editvalue],[data-mtab],[data-meeting],[data-done],[data-prompt],[data-wa],[data-wabtn]');if(!el)return;const ds=el.dataset;if(ds.wabtn){waChoose(ds.wabtn);return}
if(ds.alert){if(ds.act==='dismiss'){S.alertState[ds.alert]='x';render();return toast('Sugestão dispensada')}if(!/^(prep|review|pdi|fb|sched|rec|evalL)/.test(ds.act))S.alertState[ds.alert]='ok';return handleAction(ds.act)}
if(ds.nav)return nav(ds.nav);if(ds.action)return handleAction(ds.action);
if(ds.person){S.selected=ds.person;S.rxTab='raiox';return nav('employee')}
if(ds.rxtab){S.rxTab=ds.rxtab;return render()}if(ds.ctab){S.collectTab=ds.ctab;return render()}if(ds.devtab){S.devTab=ds.devtab;return render()}if(ds.dtab){S.dashTab=ds.dtab;return render()}
if(ds.mtab){S.modelTab=ds.mtab;return render()}if(ds.afilter){S.alertFilter=ds.afilter;return render()}if(ds.recfilter){S.recFilter=ds.recfilter;return render()}
if(ds.editvalue){S.temp=ds.editvalue;return openModal('editCulture')}
if(ds.meeting){S.meeting=Number(ds.meeting);S.devTab='oneone';return S.screen==='dev'?render():nav('dev')}
if(ds.done){const p=db.plans.find(z=>z.id===Number(ds.done));if(p){p.done=!p.done;render();toast('Status atualizado')}return}
if(ds.prompt){S.copilot.push({who:'me',text:ds.prompt},{who:'ai',text:simulatedAi(ds.prompt)});return render()}
if(ds.wa){if(!S.wa.busy){waPlay(ds.wa);render()}return}});
document.addEventListener('submit',e=>{if(e.target.id==='modalform'){e.preventDefault();submitForm(e.target.dataset.form,e.target)}});
function chgModel(t,v){if(t.dataset.chk){const [k,a,b]=t.dataset.chk.split(':'),on=t.checked;if(k==='man'){db.model.manifesto.formulaAuto=on}else if(k==='col'){db.model.collect[a]=on;db.model.collect.preset='custom';db.model.collect.name='Personalizado'}else if(k==='beh'){const x=value(a).beh.find(z=>z.id===b);if(x)x.on=on}else if(['prin','cyc','lead','dim'].includes(k)){const x=({prin:db.model.principles,cyc:db.model.cycle,lead:db.model.leadership,dim:db.model.dims})[k].find(z=>z.id===a);if(x)x.on=on}else if(k==='kpi'){const x=db.kpis.find(z=>z.id===a);if(x)x.on=on}render();return true}
 if(t.dataset.field){const [k,a,b]=t.dataset.field.split(':');if(k==='man')db.model.manifesto[a]=v;if(k==='pil'){const p=value(a);if(p)p[b]=v}if(k==='cfg')db.model.cfg[a]=Number(v);if(k==='col'){const n=['peerCount','deadlineDays'].includes(a);db.model.collect[a]=n?Math.max(1,Number(v)||1):v;db.model.collect.preset='custom';db.model.collect.name='Personalizado'}return true}
 if(t.name==='value'&&t.closest('#modalform')){const sel=$('#modalform select[name="beh"]');if(sel)sel.innerHTML=behOptions(v);return true}return false}
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(chgModel(e.target,v))return;if(id==='cycle-sel'){S.cycleSel=Number(v);return render()}if(id==='fbm-value'){const f=$('#modalform');['s','c','i'].forEach(q=>{if(f.elements[q])S.fb[q]=f.elements[q].value});S.fb.value=v;return openModal('fbModal')}if(id==='ai-person'){S.selected=v;render()}if(id==='portal-person'){S.portal=v;render()}if(id==='team-area'){S.teamArea=v;render()}if(id==='dash-area'){S.area=v;render()}if(id==='fb-person'||id==='fb-value'){S.fb[id==='fb-person'?'person':'value']=v;render()}if(id==='pdi-person'){S.pdiDraft=pdiSuggest(v);openModal('pdiAI')}});
document.addEventListener('input',e=>{const id=e.target.id;if(e.target.classList?.contains('auto')){e.target.style.height='auto';e.target.style.height=(e.target.scrollHeight+2)+'px'}if(id==='team-search'){S.query=e.target.value;const pos=e.target.selectionStart;render();const el=$('#team-search');el.focus();el.setSelectionRange(pos,pos)}if(id==='ai-input')S.draftAI=e.target.value;if(['fb-s','fb-c','fb-i'].includes(id)){S.fb[id.slice(3)]=e.target.value;const pv=$('#fb-prev');if(pv)pv.innerHTML=fbPreview()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();if(e.key==='Enter'&&/^n[bi]-/.test(e.target.id||'')){e.preventDefault();const idd=e.target.id;if(idd.startsWith('nb-')){const mm=idd.match(/^nb-(.+)-([ea])$/);handleAction(`addBeh:${mm[1]}:${mm[2]}`)}else handleAction('addItem:'+idd.slice(3))}if(e.key==='Enter'&&e.target.id==='ai-input'){e.preventDefault();handleAction('sendAI')}});
const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
document.addEventListener('mousemove',e=>{const t=e.target.closest?.('[data-tip]');if(!t){tip.style.display='none';return}tip.innerHTML=t.getAttribute('data-tip');tip.style.display='block';tip.style.left=Math.min(window.innerWidth-250,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'});
function fit(){const st=$('#stage');if(window.innerWidth<=800){st.style.transform='none';st.style.height='auto';return}const sc=Math.min(1,window.innerWidth/1600,window.innerHeight/1200);st.style.transform=`scale(${sc})`;st.style.height=`${1200*sc}px`;st.style.marginBottom=`${-1200*(1-sc)}px`}
window.addEventListener('resize',fit);render(true);fit();

{let wasMob=isMob();addEventListener('resize',()=>{const m=isMob();if(m!==wasMob){wasMob=m;S.menuOpen=false;render()}})}

</script>
